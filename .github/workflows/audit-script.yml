name: Security Audit

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 프로젝트가 pnpm이므로 pnpm으로 설치해야 lockfile과 pnpm.overrides가 반영된다.
      # npm install은 pnpm-lock.yaml과 pnpm.overrides를 모두 무시한다.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        id: audit
        run: |
          # exit code만 보면 네트워크/레지스트리 오류 같은 실행 실패까지
          # 취약점 발견으로 오인한다. JSON을 받아 파싱해서 둘을 구분한다.
          set +e
          pnpm audit --json > audit.json 2> audit-error.txt
          set -e

          # 실행에 실패해도 pnpm은 {"error": {...}} 형태의 유효한 JSON을 내보내고
          # stderr는 비어 있다. 따라서 JSON 파싱 여부가 아니라
          # metadata.vulnerabilities 존재 여부로 판정해야 한다.
          if ! jq -e '.metadata.vulnerabilities | objects' audit.json > /dev/null 2>&1; then
            echo "::error::pnpm audit 실행에 실패했습니다 (취약점 판정 아님)"
            cat audit.json audit-error.txt
            exit 1
          fi

          total=$(jq '[.metadata.vulnerabilities[]] | add // 0' audit.json)
          echo "total=$total" >> $GITHUB_OUTPUT

          # 이슈 본문과 로그에 넣을 사람이 읽는 형식
          pnpm audit > audit-result.txt 2>&1 || true
          cat audit-result.txt

          if [ "$total" -gt 0 ]; then
            jq -r '.metadata.vulnerabilities | to_entries[] | select(.value > 0) | "\(.key) \(.value)건"' audit.json \
              | while read -r line; do echo "::warning::$line"; done
          fi

      # 이슈는 master push에서만 만든다. PR은 빨간 X와 머지 차단으로 충분하고,
      # PR마다 이슈를 만들면 수정할 때마다 쌓인다.
      - name: Report vulnerability as issue
        if: github.event_name == 'push' && steps.audit.outputs.total != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const TITLE = '🚨 보안 취약점 발견 - pnpm audit';
            const MAX = 50000; // 이슈 본문 길이 제한(65536) 여유분

            let result = fs.readFileSync('audit-result.txt', 'utf8');
            if (result.length > MAX) {
              result = result.slice(0, MAX) + '\n\n... (출력이 길어 잘렸습니다)';
            }

            const total = '${{ steps.audit.outputs.total }}';
            const body = [
              `\`master\` 브랜치에서 보안 취약점 **${total}건**이 발견되었습니다.`,
              '',
              `커밋: ${context.sha}`,
              `실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '<details>',
              '<summary>audit 결과</summary>',
              '',
              '```',
              result,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security',
              state: 'open',
            });
            const existing = issues.find((issue) => issue.title === TITLE);

            // 열린 이슈가 있으면 새로 만들지 않고 최신 결과로 갱신한다.
            // 예전 구현은 여기서 그냥 건너뛰어서, 이슈 하나가 열려 있는 동안
            // 새 취약점이 영구히 보고되지 않았다.
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`기존 이슈 #${existing.number} 갱신`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
                labels: ['security'],
              });
              core.info(`이슈 #${created.number} 생성`);
            }

      # 취약점이 해소되면 열린 이슈를 닫는다. 이게 없으면 방치된 이슈가
      # 남아 다음 보고를 계속 덮어쓰게 된다.
      - name: Close issue when clean
        if: github.event_name == 'push' && steps.audit.outputs.total == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const TITLE = '🚨 보안 취약점 발견 - pnpm audit';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'security',
              state: 'open',
            });
            for (const issue of issues.filter((i) => i.title === TITLE)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `커밋 \`${context.sha}\` 기준으로 취약점이 모두 해소되어 자동으로 닫습니다.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`이슈 #${issue.number} 닫음`);
            }

      # 게이트. 이슈 보고 뒤에 둬야 실패로 스킵되지 않는다.
      - name: Fail on vulnerability
        if: steps.audit.outputs.total != '0'
        run: |
          echo "::error::보안 취약점 ${{ steps.audit.outputs.total }}건이 발견되어 실패 처리합니다."
          exit 1
